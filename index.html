<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>MOVAROW — Driver App</title>
<template id="__bundler_thumbnail" data-bg-color="#0B0B0B"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0B0B0B"/></svg></template>
<link rel="preload" as="image" href="logo-dark2.png" />
<link rel="preload" as="image" href="logo-white2.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0B0B0B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVAROW" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap');
/* ===========================================================================
   MOVAROW Customer App — premium dark + yellow, single-file prototype styles
   =========================================================================== */
:root{
  --y:#FFCC00; --y-press:#E6B800; --y-soft:rgba(255,204,0,.14); --y-soft2:rgba(255,204,0,.08);
  --blk:#0B0B0B; --g1:#151515; --g2:#1E1E1E; --g3:#2A2A2A; --g4:#383838;
  --white:#FFFFFF; --ink:#F4F4F5; --sub:#A1A1A6; --faint:#6B6B70;
  --green:#22C55E; --green-soft:rgba(34,197,94,.16); --red:#EF4444; --red-soft:rgba(239,68,68,.15);
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.05);
  --font:'Hanken Grotesk','Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --display:'Archivo Black','Hanken Grotesk',sans-serif;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  /* ── MOVAROW Motion System tokens ── */
  --d-instant:100ms; --d-fast:200ms; --d-base:320ms; --d-slow:500ms; --d-cinematic:800ms;
  --e-enter:cubic-bezier(.16,1,.3,1); --e-exit:cubic-bezier(.7,0,.84,0); --e-move:cubic-bezier(.33,1,.68,1); --e-emph:cubic-bezier(.65,0,.35,1);
}
.screen[data-theme="light"]{
  --blk:#F4F4F5; --g1:#FFFFFF; --g2:#F0F0F3; --g3:#E5E5EA; --g4:#D6D6DC;
  --ink:#0B0B0B; --sub:#52525B; --faint:#9AA0A6;
  --hair:rgba(0,0,0,.09); --hair2:rgba(0,0,0,.05);
  --y-soft:rgba(255,204,0,.22); --y-soft2:rgba(255,204,0,.12);
  --green-soft:rgba(34,197,94,.14); --red-soft:rgba(239,68,68,.12);
  --shadow:0 10px 40px rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);background:#000;color:var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ---- phone frame ---- */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%,#1a1a1c 0%,#080808 60%,#000 100%)}
.device{position:relative;width:390px;height:844px;background:var(--blk);border-radius:54px;
  box-shadow:0 0 0 12px #1b1b1d,0 0 0 14px #2c2c2e,0 50px 90px -20px rgba(0,0,0,.7);
  overflow:hidden;transform-origin:center}
.screen{position:absolute;inset:0;border-radius:54px;overflow:hidden;background:var(--blk);color:var(--ink);display:flex;flex-direction:column}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:30px;
  background:#000;border-radius:18px;z-index:200;pointer-events:none}
/* ── App mode: fill the real device screen (Capacitor native). Hides the mockup phone
   frame/notch and lets the UI go edge-to-edge. Browser preview keeps the phone frame. ── */
:root.native-app,.native-app body{height:100%}
.native-app body{display:block;background:var(--blk);overflow:hidden}
.native-app .stage{position:fixed;inset:0;display:block;background:var(--blk)}
.native-app .device{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none}
.native-app .screen{border-radius:0}
.native-app .notch{display:none}
.native-app .statusbar{flex-basis:auto;height:auto;min-height:50px;padding-top:calc(env(safe-area-inset-top) + 14px)}
/* ── Passcode lock screen ── */
#lockscreen{position:fixed;inset:0;z-index:99999;background:radial-gradient(120% 120% at 50% 0%,#1a1a1c 0%,#080808 60%,#000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 30px;
  font-family:'Hanken Grotesk','Cairo',-apple-system,sans-serif;color:#F4F4F5}
#lockscreen.hidden{display:none}
#lockscreen .lk-lock{width:56px;height:56px;border-radius:16px;background:rgba(255,204,0,.14);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
#lockscreen .lk-logo{font-family:'Archivo Black','Hanken Grotesk',sans-serif;font-size:30px;letter-spacing:1px;color:#FFCC00}
#lockscreen .lk-sub{font-size:15px;color:#A1A1A6;margin-top:-8px;text-align:center}
#lockscreen .lk-input{width:100%;max-width:290px;height:56px;background:#1E1E1E;border:1.5px solid rgba(255,255,255,.08);
  border-radius:16px;text-align:center;font-size:19px;letter-spacing:2px;color:#F4F4F5;outline:none;transition:border-color .15s}
#lockscreen .lk-input::placeholder{color:#6B6B70;letter-spacing:4px}
#lockscreen .lk-input:focus{border-color:#FFCC00}
#lockscreen .lk-btn{width:100%;max-width:290px;height:56px;border-radius:16px;background:#FFCC00;color:#0B0B0B;
  font-weight:700;font-size:16.5px;border:none;cursor:pointer;transition:background .15s,transform .1s}
#lockscreen .lk-btn:active{background:#E6B800;transform:scale(.985)}
#lockscreen .lk-err{color:#EF4444;font-size:14px;height:18px;opacity:0;transition:opacity .2s}
#lockscreen .lk-err.show{opacity:1}

/* status bar */
.statusbar{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px 0;font-size:14px;font-weight:600;color:#0B0B0B;background:var(--y);z-index:50;position:relative}
.statusbar.dark{color:#0B0B0B}
.sb-r{display:flex;align-items:center;gap:6px}

/* view (screen body) */
.view{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.view-inner{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view-inner::-webkit-scrollbar{width:0}
*::-webkit-scrollbar{width:0;height:0;background:transparent}
*{scrollbar-width:none;-ms-overflow-style:none}
.pad{padding:6px 22px 28px}
.bottom-cta{padding:14px 22px calc(18px + env(safe-area-inset-bottom));background:var(--blk)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;
  border-radius:3px;background:rgba(255,255,255,.4);z-index:120}
.home-ind.dark{background:rgba(11,11,11,.45)}

/* transitions */
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
@keyframes splashFlash{0%{opacity:1}100%{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes splashReveal{0%{transform:scale(.86)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.anim-in{animation:slideIn var(--d-base) var(--e-enter)}
.anim-back{animation:slideBack var(--d-base) var(--e-enter)}
.anim-fade{animation:fadeUp var(--d-base) var(--e-enter) both}
.scr.anim-in{animation:slideIn var(--d-base) var(--e-enter)}
.scr.anim-back{animation:slideBack var(--d-base) var(--e-enter)}

/* typography */
.h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:0 0 6px;color:var(--ink)}
.h2{font-size:23px;font-weight:800;letter-spacing:-.3px;margin:0}
.sub{font-size:16px;color:var(--sub);line-height:1.5;margin:0}
.label{font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.money{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;position:relative;z-index:20}
.topbar .tb-title{font-size:17px;font-weight:700;flex:1;text-align:center}
.iconbtn{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:var(--g2)}
.iconbtn.ghost{background:transparent}
.iconbtn:active{transform:scale(.94)}

/* buttons */
.btn{width:100%;height:56px;border-radius:16px;font-size:16.5px;font-weight:700;letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform var(--d-instant) var(--e-enter),background var(--d-fast)}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--y);color:var(--blk)}
.btn-primary:active{background:var(--y-press)}
.btn-primary[disabled]{background:var(--g3);color:var(--faint);pointer-events:none}
.btn-dark{background:var(--blk);color:var(--white)}
.btn-ghost{background:transparent;color:var(--y);box-shadow:inset 0 0 0 1.5px var(--y)}
.btn-soft{background:var(--g2);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{height:46px;border-radius:13px;font-size:14.5px;width:auto;padding:0 22px}

/* cards / inputs */
.card{background:var(--g1);border:1px solid var(--hair);border-radius:18px}
.field{width:100%;height:54px;background:var(--g2);border:1.5px solid transparent;border-radius:15px;
  padding:0 16px;color:var(--ink);font-size:16px;font-weight:500;outline:none;transition:border-color .15s}
.field::placeholder{color:var(--faint)}
.field:focus{border-color:var(--y)}
.field-lbl{font-size:14.5px;font-weight:700;color:var(--sub);margin:0 0 8px;display:block}
.row{display:flex;align-items:center;gap:12px}

/* selectable card */
.sel{background:var(--g1);border:1.5px solid var(--hair);border-radius:18px;padding:16px;
  display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s;width:100%;text-align:start}
.sel:active{transform:scale(.99)}
.sel.on{border-color:var(--y);background:var(--y-soft2)}
.sel-radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--g4);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.sel.on .sel-radio{border-color:var(--y);background:var(--y)}
.svc-ic{width:48px;height:48px;border-radius:14px;background:var(--g3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sel.on .svc-ic{background:var(--y);color:var(--blk)}

/* service grid (home) */
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc-tile{background:var(--g1);border:1px solid var(--hair);border-radius:18px;padding:18px 16px;
  display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:start;transition:transform .1s}
.svc-tile:active{transform:scale(.97)}
.svc-tile .svc-ic{width:46px;height:46px}
.svc-tile .t{font-size:16.5px;font-weight:700;line-height:1.2}

/* chips / segmented */
.seg{display:flex;gap:6px;background:var(--g2);border-radius:14px;padding:4px}
.seg button{flex:1;height:42px;border-radius:11px;font-size:16px;font-weight:700;color:var(--sub);transition:.15s}
.seg button.on{background:var(--y);color:var(--blk)}
.chip{padding:11px 16px;border-radius:999px;font-size:15.5px;font-weight:600;background:var(--g2);color:var(--sub);
  border:1.5px solid transparent}
.chip.on{background:var(--y-soft);color:var(--y);border-color:var(--y)}

/* KYC document tiles */
.doc-tile{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:15px;
  text-align:start;cursor:pointer;overflow:hidden;border:1.5px solid var(--g3);background:var(--g1);
  transition:transform .14s cubic-bezier(.2,.9,.25,1.1),border-color .18s,background .18s}
.doc-tile::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .25s;
  background:radial-gradient(120% 120% at 0% 0%,rgba(255,204,0,.10),transparent 60%);pointer-events:none}
.doc-tile:hover::before{opacity:1}
.doc-tile:active{transform:scale(.975)}
.doc-tile.empty{border-style:dashed}
.doc-tile.done{border-color:rgba(34,197,94,.4);background:var(--green-soft)}
.doc-ic{width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--y-soft),var(--y-soft2))}
.doc-tile.done .doc-ic{background:rgba(34,197,94,.18)}
.doc-check{position:absolute;top:7px;inset-inline-end:7px;width:17px;height:17px;border-radius:50%;
  background:var(--green);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px var(--g1);animation:docPop .32s cubic-bezier(.2,.9,.25,1.4) both}
@keyframes docPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.area-chip{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  border:1.5px solid var(--g3);background:var(--g1);color:var(--sub);transition:.15s}
.area-chip:active{transform:scale(.95)}
.area-chip.on{border-color:var(--y);background:var(--y-soft);color:#FFCC00}
.fb-card{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 8px;
  border-radius:14px;cursor:pointer;border:1.5px solid var(--g3);background:var(--g1);
  font-size:12.5px;font-weight:800;color:var(--sub);transition:.15s}
.fb-card:active{transform:scale(.97)}
.fb-card.on{border-color:var(--y);background:var(--y-soft2);color:#FFCC00}

/* option cards */
.opt{position:relative;background:var(--g1);border:1.5px solid var(--hair);border-radius:18px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;transition:.15s;width:100%;text-align:start}
.opt.on{border-color:var(--y);background:var(--y-soft2)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.03em;
  padding:4px 9px;border-radius:7px}
.badge-y{background:var(--y);color:var(--blk)}
.badge-g{background:var(--green-soft);color:var(--green)}
.badge-p{background:rgba(168,130,255,.18);color:#C4A8FF}
.badge-rec{background:var(--y-soft);color:var(--y)}

/* map */
.map{position:absolute;inset:0;z-index:0;isolation:isolate;background:
  radial-gradient(100% 80% at 30% 10%,#1c2430 0%,#10151c 55%,#0a0e13 100%);overflow:hidden}
.map > svg{position:absolute;inset:0;width:100%;height:100%}
.map-pin{position:absolute;transform:translate(-50%,-100%);z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.map-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--y);
  border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(255,204,0,.25);z-index:6}
.map-car{position:absolute;width:34px;height:34px;border-radius:10px;background:var(--blk);
  display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);z-index:7;
  box-shadow:0 4px 12px rgba(0,0,0,.5);transition:left 1s linear,top 1s linear}
.map-fab{position:absolute;width:42px;height:42px;border-radius:12px;background:rgba(20,20,22,.8);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}

/* ---- real map (Leaflet) ---- */
.map .leaflet-container{position:absolute;inset:0;width:100%;height:100%;background:#e8eaed;font:inherit}
.map .leaflet-tile-pane{filter:saturate(1.08) contrast(1.04) brightness(1.01)}
.lf-pin{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.lf-dot{width:16px;height:16px;border-radius:50%;background:var(--y);border:3px solid #fff;box-shadow:0 0 0 3px rgba(11,11,11,.18),0 0 0 7px rgba(255,204,0,.22)}
.lf-truck-act img{position:relative;z-index:2}
.lf-self{position:relative;width:100%;height:100%}
.lf-self::before{content:'';position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,0,.32),rgba(255,204,0,0) 70%);animation:selfPulse 2s ease-out infinite;z-index:0}
@keyframes selfPulse{0%{transform:translate(-50%,-50%) scale(.5);opacity:.85}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.lf-bar{position:absolute;left:50%;top:13px;transform:translateX(-50%);
  width:19px;height:6px;border-radius:3px;z-index:3;display:flex;gap:1px;
  padding:1px;box-sizing:border-box;overflow:hidden;pointer-events:none;
  background:linear-gradient(#3b4047,#15171b);
  box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5),inset 0 .5px .5px rgba(255,255,255,.18)}
.lf-bar i{flex:1;height:100%;border-radius:1.5px}
.lf-bar i.l{background:var(--haz1,#FFB300);animation:barWigA .6s steps(1,end) infinite}
.lf-bar i.r{background:var(--haz2,#FF7A00);animation:barWigB .6s steps(1,end) infinite}
.lf-load{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:17px;height:23px;z-index:2;pointer-events:none;border-radius:5px/6px;background:linear-gradient(180deg,#eef2f7,#bcc5d0);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.45)}
.lf-load::before{content:'';position:absolute;left:50%;top:5px;transform:translateX(-50%);width:11px;height:12px;border-radius:3px;background:linear-gradient(180deg,#7c8693,#566069);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.4)}
.lf-load::after{content:'';position:absolute;left:50%;top:4px;transform:translateX(-50%);width:12px;height:3px;border-radius:2px;background:rgba(150,200,255,.6)}
@keyframes barWigA{0%,49%{opacity:1;box-shadow:0 0 6px 2px var(--haz1,#FFB300)}50%,100%{opacity:.28;box-shadow:none}}
@keyframes barWigB{0%,49%{opacity:.28;box-shadow:none}50%,100%{opacity:1;box-shadow:0 0 6px 2px var(--haz2,#FF7A00)}}
.leaflet-bar,.leaflet-control-attribution{display:none!important}

/* status badge / list rows */
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-size:14.5px;font-weight:700}
.statrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--hair2)}
.statrow:last-child{border-bottom:none}
.statrow .k{font-size:14.5px;color:var(--sub)}
.statrow .v{font-size:14.5px;font-weight:700}
.menurow{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:start;border-bottom:1px solid var(--hair2)}
.menurow:last-child{border-bottom:none}
.menurow .mi{width:38px;height:38px;border-radius:11px;background:var(--g3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.menurow .ml{flex:1;font-size:15.5px;font-weight:600}

/* bottom nav */
.nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--g1);
  border-top:1px solid var(--hair);padding-bottom:24px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0 6px;color:var(--faint);font-size:12.5px;font-weight:600}
.nav button.on{color:var(--y)}

/* photo grid */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo{aspect-ratio:1;border-radius:16px;background:var(--g2);border:1.5px dashed var(--g4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:13px;font-weight:600;transition:.15s}
.photo.on{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green)}

/* OTP */
.otp-boxes{display:flex;gap:14px;justify-content:center}
.otp-box{width:62px;height:70px;border-radius:18px;background:var(--g2);border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.otp-box.active{border-color:var(--y)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:58px;border-radius:16px;background:var(--g2);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--g3)}

/* steps */
.steps{display:flex;align-items:center;gap:6px;padding:4px 0 2px}
.step-dot{flex:1;height:4px;border-radius:3px;background:var(--g3)}
.step-dot.on{background:var(--y)}

/* modal / sheet */
.scrim{position:absolute;inset:0;z-index:900;background:rgba(0,0,0,.68);
  display:flex;flex-direction:column;justify-content:flex-end;animation:fadeUp var(--d-fast) var(--e-enter)}
.scrim.center{justify-content:center;align-items:center;padding:24px}
.sheet{background:var(--g1);border-top-left-radius:26px;border-top-right-radius:26px;
  padding:14px 22px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:sheetUp var(--d-base) var(--e-enter);max-height:88%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--g4);margin:0 auto 16px}
.modal{background:var(--g1);border-radius:24px;padding:24px 22px;width:100%;box-shadow:var(--shadow);animation:pop var(--d-base) var(--e-enter) both}

/* chat */
.bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.35;font-weight:500}
.bubble.me{align-self:flex-end;background:var(--y);color:var(--blk)}
.bubble.them{align-self:flex-start;background:var(--g2);color:var(--ink)}
.chat-time{font-size:11px;color:var(--faint);margin-top:4px}

/* stars */
.stars{display:flex;gap:12px;justify-content:center}
.star{font-size:42px;line-height:1;color:var(--g4);transition:transform .1s}
.star.on{color:var(--y)}
.star:active{transform:scale(1.15)}

/* misc */
.center{text-align:center}
/* Motion System: forward sweep loader — never a rotating spinner */
.spinner{position:relative;width:52px!important;height:6px!important;border:none!important;border-radius:5px;background:var(--g3);overflow:hidden;margin:0 auto;flex:0 0 auto}
.spinner::before{content:'';position:absolute;top:0;left:0;height:100%;width:44%;border-radius:5px;background:linear-gradient(90deg,rgba(255,204,0,.12),var(--y));animation:sweepLoad 1.2s var(--e-move) infinite}
@keyframes sweepLoad{0%{transform:translateX(-70%)}100%{transform:translateX(300%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:22px;right:22px;bottom:96px;z-index:350;background:var(--g3);color:var(--ink);
  border-radius:14px;padding:14px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;animation:fadeUp var(--d-fast) var(--e-enter)}
.divider{height:1px;background:var(--hair);margin:0}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--y);
  background:var(--y-soft);padding:4px 10px;border-radius:7px}

/* plate preview */
.plate{display:inline-flex;align-items:stretch;border-radius:8px;overflow:hidden;border:2px solid #111;
  font-weight:800;min-height:54px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.plate .side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px;font-size:11px;line-height:1.1}
.plate .cat{display:flex;align-items:center;justify-content:center;padding:0 12px;font-size:24px}
.plate .num{display:flex;align-items:center;justify-content:center;padding:0 14px;font-size:26px;letter-spacing:1px}
.plate.ad{background:#fff;color:#0b0b0b}
.plate.ad .side{background:#c1121f;color:#fff}
.plate.white{background:#fff;color:#0b0b0b}
.plate.white .side{background:#0b0b0b;color:#fff}

/* ===== driver-specific ===== */
.online-card{background:var(--g1);border:1px solid var(--hair);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.power{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.25s;position:relative}
.power.off{background:var(--g3)}
.power.on{background:var(--y);box-shadow:0 0 0 6px rgba(255,204,0,.18)}
.req-card{background:var(--g1);border:1px solid var(--hair);border-radius:20px;padding:16px;animation:fadeUp .3s ease both}
.earn-hero{background:linear-gradient(135deg,#FFCC00,#E6B800);border-radius:22px;padding:22px;color:#0B0B0B}
.earn-stat{background:var(--g1);border:1px solid var(--hair);border-radius:16px;padding:14px 16px;flex:1}
.timeline{position:relative;padding-inline-start:30px}
.tl-step{position:relative;padding-bottom:20px}
.tl-step:last-child{padding-bottom:0}
.tl-dot{position:absolute;inset-inline-start:-30px;top:0;width:22px;height:22px;border-radius:50%;background:var(--g3);display:flex;align-items:center;justify-content:center;z-index:2}
.tl-step.on .tl-dot{background:var(--y);color:#0B0B0B}
.tl-step.done .tl-dot{background:var(--green);color:#fff}
.tl-line{position:absolute;inset-inline-start:-20px;top:22px;bottom:0;width:2px;background:var(--g3)}
.tl-step.done .tl-line{background:var(--green)}
.codebox{width:48px;height:60px;border-radius:14px;background:var(--g2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.codebox.active{border-color:var(--y)}
.codebox.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.codebox.err{border-color:var(--red);background:var(--red-soft);color:var(--red)}
/* ============ RTL (Arabic / Urdu) ============ */
[dir="rtl"] .ic-dir{transform:scaleX(-1)}
[dir="rtl"] .map-fab{right:auto!important;left:14px}
[dir="rtl"] .toast{direction:rtl}
[dir="rtl"] .plate,[dir="rtl"] .codebox,[dir="rtl"] .keypad,[dir="rtl"] .otp-row,[dir="rtl"] input[inputmode="tel"],[dir="rtl"] input[inputmode="numeric"]{direction:ltr}
[dir="rtl"] .statrow,[dir="rtl"] .between{direction:rtl}
[dir="rtl"] .nav button span[style*="position:absolut"]{right:auto;left:50%}

/* Uber-style countdown ring for single incoming request */
.cd-ring{transform:rotate(-90deg)}
.cd-ring circle{fill:none;stroke-width:5}
.cd-track{stroke:rgba(255,255,255,.18)}
.cd-prog{stroke:#FFCC00;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
@keyframes reqPop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bannerDown{0%{transform:translateY(-150%);opacity:0}60%{transform:translateY(6%)}100%{transform:translateY(0);opacity:1}}
@keyframes bannerGlow{0%,100%{box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 4px rgba(255,204,0,.12),0 2px 0 rgba(255,204,0,.35) inset}50%{box-shadow:0 18px 52px rgba(0,0,0,.6),0 0 0 7px rgba(255,204,0,.22),0 2px 0 rgba(255,204,0,.45) inset}}
.req-banner{position:absolute;left:10px;right:10px;top:50px;z-index:60;display:flex;align-items:center;gap:11px;
  background:linear-gradient(180deg,#23210f,var(--g2));border:1.5px solid var(--y);border-radius:18px;padding:13px 13px;cursor:pointer;
  box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 4px rgba(255,204,0,.12),0 2px 0 rgba(255,204,0,.35) inset;
  animation:bannerDown .42s cubic-bezier(.2,.9,.25,1.1) both, bannerGlow 1.5s ease-in-out infinite}
.req-banner:active{transform:scale(.985)}
.req-banner .rb-ic{position:relative;width:54px;height:54px;flex:0 0 auto;border-radius:15px;background:var(--y-soft);display:flex;align-items:center;justify-content:center}
.req-banner .rb-ic::after{content:'';position:absolute;inset:-4px;border-radius:15px;border:2px solid var(--y);opacity:.5;animation:pulse 1.4s ease-out infinite}
.req-banner .rb-cd{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--y);color:#0B0B0B;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,204,0,.2)}
@keyframes bannerUp{0%{transform:translateY(150%);opacity:0}60%{transform:translateY(-2%)}100%{transform:translateY(0);opacity:1}}
.req-banner.req-bottom{top:auto;bottom:96px;animation:bannerUp .42s cubic-bezier(.2,.9,.25,1.1) both, bannerGlow 1.5s ease-in-out infinite}

</style>

}

async function _osrm(a,b){
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`;
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),3500);
    const r=await fetch(u,{signal:ctl.signal}); clearTimeout(to); const j=await r.json();
    if(j.routes&&j.routes[0]) return j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
  }catch(e){}
  return [a,b];
}
function _bendPath(a,b){
  const N=18, out=[];
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const len=Math.hypot(dx,dy)||1e-6, px=-dy/len, py=dx/len;
  const amp=len*0.12;
  for(let i=0;i<=N;i++){ const t=i/N; const bow=Math.sin(t*Math.PI)*amp; out.push([a[0]+dx*t+px*bow, a[1]+dy*t+py*bow]); }
  return out;
}

function initLeafletMaps(){
  if(typeof LF==='undefined'||!LF) return;
  pruneLeafletMaps();
  const jobs=_pendingMaps; _pendingMaps=[];
  jobs.forEach(({id,opts})=>{
    const node=document.getElementById(id); if(!node||node._lmapDone) return; node._lmapDone=1;
    const drag=!opts.static;
    const map=LF.map(node,{zoomControl:false,attributionControl:false,dragging:drag,
      scrollWheelZoom:!opts.static,doubleClickZoom:!opts.static,boxZoom:false,keyboard:false,
      tap:false,touchZoom:!opts.static,zoomSnap:0,zoomAnimation:false});
    _leafletMaps[id]=map; node.classList.add('lmap-live');
    // ── Map tiles: Google Maps look ──
    // lyrs=m -> Google roadmap (classic Google Maps look). lyrs=s satellite, lyrs=y hybrid, lyrs=p terrain.
    // NOTE: Google's public tile endpoint is not an officially licensed Leaflet source (Google ToS).
    // Fine for a prototype/demo; for App Store production use a licensed provider (or switch to the
    // real Google Maps JS API). To revert to the licensed Google-like Voyager tiles, use the
    // commented CartoDB line below instead.
    LF.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:20}).addTo(map);
    // LF.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20}).addTo(map);
    // route legs (driver perspective): toPickup = self→pickup, toDrop = pickup→drop
    let from=null,to=null,leg=null;
    if(opts.route){ leg=opts.leg||(S.jobStage==='transit'?'toDrop':'toPickup'); from=leg==='toDrop'?GEO.pickup:GEO.self; to=leg==='toDrop'?GEO.drop:GEO.pickup; }
    const pts=[];
    if(opts.dot){ LF.marker(GEO.self,{icon:_dotIcon()}).addTo(map); pts.push(GEO.self); }
    if(opts.self){ LF.marker(GEO.self,{icon:_selfIcon()}).addTo(map); pts.push(GEO.self); }
    if(opts.pin){ const p=to||GEO.pickup; LF.marker(p,{icon:_pinIcon()}).addTo(map); pts.push(p); }
    let truck=null;
    if(opts.car){ truck=LF.marker(from||GEO.self,{icon:_truckIcon()}).addTo(map); map._truck=truck; pts.push(from||GEO.self); }
    const center=opts.center||GEO.self;
    map.setView(center, opts.zoom||15);
    const fit=()=>{ if(opts.nofit||opts.route) return; if(pts.length>1){ try{ map.fitBounds(LF.latLngBounds(pts).pad(0.4)); }catch(e){} } };
    const ready=()=>{ try{map.invalidateSize(false);}catch(e){} fit(); };
    requestAnimationFrame(()=>{ ready(); setTimeout(ready,180); });
    if(opts.route){
      const _legKey=leg;
      const initLine=_routeCache[_legKey]||_bendPath(from,to);
      const shadow=LF.polyline(initLine,{color:'#0B0B0B',weight:13,opacity:.92,lineCap:'round',lineJoin:'round'}).addTo(map);
      const rl=LF.polyline(initLine,{color:'#FFCC00',weight:6.5,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map);
      map._routeLine=rl; map._routeShadow=shadow;
      const fitRoute=()=>{ try{ map.invalidateSize(false); map.fitBounds(rl.getBounds().pad(0.45),{maxZoom:15}); }catch(e){} };
      fitRoute(); requestAnimationFrame(fitRoute); setTimeout(fitRoute,220);
      if(_legEpoch[_legKey]==null) _legEpoch[_legKey]=performance.now();
      const _epoch=_legEpoch[_legKey];
      if(opts.animate && truck) animateTruckAlong(id,truck,initLine,_epoch);
      if(_routeCache[_legKey]){} else _osrm(from,to).then(line=>{
        if(!line||line.length<2||line.length===2) return;
        _routeCache[_legKey]=line;
        if(!_leafletMaps[id]) return;
        shadow.setLatLngs(line); rl.setLatLngs(line);
        try{ map.invalidateSize(false); map.fitBounds(rl.getBounds().pad(0.45),{maxZoom:15}); }catch(e){}
        if(opts.animate && truck) animateTruckAlong(id,truck,line,_epoch);
      });
    }
  });
}
function animateTruckAlong(id,truck,line,epoch){
  const map=_leafletMaps[id]; if(!map) return;
  if(map._truckTimer) clearInterval(map._truckTimer);
  if(!line||line.length<2) return;
  const pl=[line[0]];
  for(let k=1;k<line.length;k++){ const p=pl[pl.length-1]; if(Math.hypot(line[k][0]-p[0],line[k][1]-p[1])>1e-5) pl.push(line[k]); }
  if(pl.length<2) return;
  const segs=[]; let total=0;
  for(let k=0;k<pl.length-1;k++){ const d=Math.hypot(pl[k+1][0]-pl[k][0],pl[k+1][1]-pl[k][1]); segs.push(d); total+=d; }
  if(total<=0) return;
  const DUR=15000;   // travel time; truck advances once and holds at the end (live position, no replay loop)
  const t0=(epoch!=null)?epoch:performance.now(); let curAng=null;
  const imgEl=()=>{ const n=truck.getElement(); return n?(n.querySelector('.lf-truck-act')||n.querySelector('img')):null; };
  const pointAt=(dist)=>{
    if(dist<=0) return pl[0];
    if(dist>=total) return pl[pl.length-1];
    let k=0,d=dist;
    while(k<segs.length-1 && d>segs[k]){ d-=segs[k]; k++; }
    const a=pl[k], b=pl[k+1]||pl[k], r=segs[k]?d/segs[k]:0;
    return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r];
  };
  const tangentDeg=(d)=>{
    const m=_leafletMaps[id]; if(!m) return null;
    let span=0.00018, guard=0, p0, p1;
    do{
      p0=m.latLngToContainerPoint(pointAt(Math.max(0,d-span)));
      p1=m.latLngToContainerPoint(pointAt(Math.min(total,d+span)));
      if(Math.hypot(p1.x-p0.x,p1.y-p0.y)>=16) break;
      span*=1.8;
    }while(guard++<7);
    return Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI+90;
  };
  const _tick=()=>{
    if(!_leafletMaps[id]||!truck._map){ clearInterval(map._truckTimer); return; }
    const frac=Math.min(1,(performance.now()-t0)/DUR);
    const d=frac*total;
    truck.setLatLng(pointAt(d));
    if(frac>=1){ const el0=imgEl(); if(curAng!=null&&el0){ el0.style.transform=`rotate(${curAng}deg)`; el0.style.transformOrigin='50% 50%'; } clearInterval(map._truckTimer); return; }
    const el=imgEl();
    if(el){
      let target=tangentDeg(d);
      if(target!=null){
        if(curAng===null) curAng=target;
        else { let dl=((target-curAng+540)%360)-180; if(Math.abs(dl)>2.2) curAng+=dl*0.35; }
        el.style.transform=`rotate(${curAng}deg)`; el.style.transformOrigin='50% 50%';
      } else if(curAng!=null){
        el.style.transform=`rotate(${curAng}deg)`; el.style.transformOrigin='50% 50%';
      }
    }
  };
  _tick();
  map._truckTimer=setInterval(_tick,40);
}
function destroyLeafletMaps(){
  Object.keys(_leafletMaps).forEach(id=>{ const m=_leafletMaps[id]; if(m&&m._truckTimer) clearInterval(m._truckTimer); try{m.remove();}catch(e){} });
  _leafletMaps={}; _pendingMaps=[];
}
// prune only maps whose DOM node was removed — does NOT touch the pending queue
function pruneLeafletMaps(){
  Object.keys(_leafletMaps).forEach(k=>{
    const m=_leafletMaps[k];
    if(!document.body.contains(m.getContainer())){
      if(m._truckTimer) clearInterval(m._truckTimer);
      try{ m.remove(); }catch(e){}
      delete _leafletMaps[k];
    }
  });
}

/* ---------------- active-job persistence ----------------
   Keeps the accepted job alive if the driver closes/refreshes the app for any
   reason, so they always return to it (a reference to the in-progress job). */
const ACTIVE_JOB_KEY='mover_driver_active_job_v2';
function persistJob(){
  try{
    if(S.job && S.jobStage!=='done'){
      localStorage.setItem(ACTIVE_JOB_KEY, JSON.stringify({
        job:S.job, jobStage:S.jobStage, acceptTs:S._acceptTs||Date.now(),
        docs:S.docs, docImgs:S.docImgs, chatThread:S.chatThread,
        deliveryCode:S.deliveryCode, codeInput:S.codeInput, codeAttempts:S.codeAttempts,
        savedAt:Date.now()
      }));
    } else {
      localStorage.removeItem(ACTIVE_JOB_KEY);
    }
  }catch(e){}
}
function restoreJob(){
  try{
    const raw=localStorage.getItem(ACTIVE_JOB_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||!d.job||d.jobStage==='done'){ localStorage.removeItem(ACTIVE_JOB_KEY); return false; }
    S.job=d.job; S.jobStage=d.jobStage||'enroute'; S._acceptTs=d.acceptTs||Date.now();
    S.docs=d.docs||{front:false,rear:false,left:false,right:false};
    S.docImgs=d.docImgs||{};
    S.chatThread=d.chatThread||[]; if(d.deliveryCode) S.deliveryCode=d.deliveryCode;
    S.codeInput=d.codeInput||''; S.codeAttempts=d.codeAttempts||0;
    S.online=true;
    return true;
  }catch(e){ return false; }
}

/* ---------------- boot ---------------- */
function boot(){
  function fit(){
    const d=el('device'); if(!d) return;
    // App mode (Capacitor native): no mockup scaling — the UI fills the real screen.
    if(document.documentElement.classList.contains('native-app')){ d.style.transform='none'; return; }
    const sc=Math.min(window.innerWidth/(390+40), window.innerHeight/(844+40), 1.15);
    d.style.transform='scale('+sc+')';
  }
  window.addEventListener('resize',fit); fit();
  const resumed = (typeof restoreJob==='function') && restoreJob();
  render();
  setTimeout(()=>{ if(S.current==='splash'){ resumed ? go('job',{replace:true}) : go('login'); } }, resumed?1600:3500);
}
/* Boot AFTER the whole concatenated script has run (so every module's
   SCREENS are defined). Defer via timeout when DOM is already parsed. */
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else setTimeout(boot, 0);

/* show the incoming-request popup OVER any screen (Uber-style), not just home.
   First a heads-up banner slides down from the top; tapping it expands the full sheet. */
function paintReqOverlay(){
  const host=el('screen'); if(!host) return;
  const ex=el('reqOverlay'); if(ex) ex.remove();
  const eb=el('reqBanner'); if(eb) eb.remove();
  if(!S.online){ S._pendReq=null; }
  if(S._pendReq && S.online && !S.job){
    // On home the request shows in full (the usual complete sheet); on other
    // screens it slides in as a heads-up banner that expands on tap.
    if(S._reqExpanded || S.current==='home'){
      host.insertAdjacentHTML('beforeend', incomingRequestOverlay(S._pendReq));
    } else {
      host.insertAdjacentHTML('beforeend', incomingRequestBanner(S._pendReq));
    }
  } else {
    S._reqExpanded=false;
  }
}

function serviceName(s){ return /Battery/i.test(s)?'Battery Assistance':/Tire/i.test(s)?'Tire Replacement':/Wash/i.test(s)?'Car Wash':'Vehicle Recovery'; }
I18N['Vehicle Recovery']={ar:'سحب ونقل المركبة',ur:'گاڑی ریکوری'};

let _serveTO=null;
let _final5TO=null;
/* map a request to its exact service so it only reaches a driver who activated that service */
function reqServiceKey(r){ return serviceName(r.svc); }
function activeServiceKeys(){ return Object.keys(S.services||{}).filter(k=>S.services[k]); }
function requestsForDriver(){
  const act=activeServiceKeys();
  if(!act.length) return S.requests.slice();           // nothing activated yet → show all (demo)
  return S.requests.filter(r=>act.includes(reqServiceKey(r)));
}
function scheduleServe(ms){ if(_serveTO) clearTimeout(_serveTO); _serveTO=setTimeout(()=>{ _serveTO=null; serveNextRequest(); }, ms); }
function toggleOnline(){
  S.online=!S.online;
  if(S.online){ _reqQueue=requestsForDriver(); render(); scheduleServe(1400); }
  else { clearReqTimer(); if(_serveTO){ clearTimeout(_serveTO); _serveTO=null; } const so=el('schedOverlay'); if(so) so.remove(); S._pendReq=null; S._reqExpanded=false; render(); }
  toast(S.online?T("You're online"):T("You're offline"),'power');
}
function clearReqTimer(){ if(_reqTimer){ clearInterval(_reqTimer); _reqTimer=null; } }

/* serve ONE request at a time with a 15s countdown */
function serveNextRequest(){
  clearReqTimer();
  if(!S.online || S.job){ S._pendReq=null; return; }
  // don't stack: if a scheduled-readiness alert is open, defer the incoming request
  if(el('schedOverlay')){ scheduleServe(2500); return; }
  // don't stack: a request is already on screen — wait until it's handled
  if(S._pendReq && (el('reqOverlay')||el('reqBanner'))){ return; }
  if(!_reqQueue.length){ S._pendReq=null; paintReqOverlay(); return; }
  S._pendReq=_reqQueue.shift();
  S._reqExpanded=(S.current==='home'); // on home → show full request directly; elsewhere → top banner
  _reqLeft=15;
  paintReqOverlay();
  _reqTimer=setInterval(()=>{
    _reqLeft--;
    const num=el('cdNum'), bar=el('cdBar'), top=el('cdNumTop');
    if(num) num.textContent=_reqLeft;
    if(top) top.textContent=_reqLeft;
    if(bar){ bar.style.width=Math.max(0,_reqLeft/15*100)+'%'; if(_reqLeft<=5) bar.style.background='#FF4D00'; }
    if(_reqLeft<=0){ clearReqTimer(); missRequest(); }
  },1000);
}
function missRequest(){
  S._pendReq=null;
  toast(T('Request missed'),'close');
  paintReqOverlay();
  scheduleServe(1600); // next trip arrives shortly
}
function declineReq(){
  clearReqTimer();
  S._pendReq=null;
  paintReqOverlay();
  toast(T('Decline'),'close');
  scheduleServe(1400);
}
function jobIsWash(){ return !!(S.job && /Wash/i.test(S.job.svc)); }
function jobStageLabel(){
  if(jobIsWash()) return {enroute:'On the way',arrived:'Arrived',docs:'Before-wash photos',code:'Confirmation code',done:'Wash completed'}[S.jobStage]||'On the way';
  return {enroute:'On the way',arrived:'Arrived',docs:'Document the vehicle',loaded:'Loading',secured:'Loading',transit:'In transit',code:'Drop-off & code',done:'Job completed'}[S.jobStage]||'On the way';
}

/* ===== scheduled (advance) booking — 30-min readiness reminder ===== */
I18N['Scheduled job']={ar:'طلب مجدول',ur:'شیڈولڈ جاب'};

I18N['Reminder dismissed']={ar:'تم تجاهل التنبيه',ur:'یاد دہانی مسترد'};

function scheduledReminderOverlay(s){
  return `<div class="scrim" id="schedOverlay" style="z-index:42">
    <div class="sheet" style="animation:reqPop .25s ease both;padding-top:10px">
      <div class="grab"></div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <span style="width:52px;height:52px;border-radius:14px;background:rgba(255,204,0,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto">${ic('clock',26,'#FFCC00')}</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:18px">${T('Confirm your readiness')}</div>
          <div style="font-size:12.5px;color:var(--sub)">${s._mins===5?T('Starts in 5 minutes'):T('Starts in 30 minutes')} · ${s.when}</div>
        </div>
      </div>
      <p style="font-size:13.5px;color:var(--sub);margin-bottom:14px;line-height:1.5">${T('Your scheduled job starts soon. Are you ready to accept it?')}</p>
      <div style="display:flex;align-items:center;gap:10px;background:var(--g2);border-radius:12px;padding:11px 14px;margin-bottom:8px">
        <span class="svc-ic" style="width:40px;height:40px;background:var(--y);color:#0B0B0B">${ic(svcIcon(s.svc),20,'#0B0B0B')}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">${T(serviceName(s.svc))} · <span class="money">${aed(s.fare)}</span></div><div style="font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.pickup} → ${s.drop}</div></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn btn-soft" style="flex:1" onclick="dismissSchedReminder()">${T("Can't make it")}</button>
        <button class="btn btn-primary" style="flex:1.4" onclick="confirmReadiness()">${ic('check',19,'#0B0B0B')} ${T("I'm ready")}</button>
      </div>
    </div>
  </div>`;
}
function schedCount(){
  if(!S.scheduled) return 0;
  if(S.scheduled.finalDue) return (!S.scheduled.finalConfirmed && !S.scheduled.finalSeen)?1:0;
  return (!S.scheduled.confirmed && !S.scheduled.seen)?1:0;
}
function navSchedCount(){
  if(!S.scheduled) return 0;
  if(S.scheduled.finalDue) return (!S.scheduled.finalConfirmed)?1:0;
  return (!S.scheduled.confirmed && !S.scheduled.navSeen)?1:0;
}
function showSchedReminder(mins){  if(!S.scheduled) return;
  // don't stack over a live incoming request
  if(S._pendReq && el('reqOverlay')){ return; }
  if(S.scheduled.finalDue){ if(S.scheduled.finalConfirmed) return; S.scheduled.finalSeen=true; }
  else { if(S.scheduled.confirmed) return; S.scheduled.seen=true; }
  const ex=el('schedOverlay'); if(ex) ex.remove();
  const host=el('screen'); if(!host) return;
  S.scheduled._mins = mins||(S.scheduled.finalDue?5:30);
  host.insertAdjacentHTML('beforeend', scheduledReminderOverlay(S.scheduled));
  if(S.scheduled._mins===5) toast(T('Starts in 5 minutes'),'clock');
}
function confirmReadiness(){
  if(!S.scheduled){ const ov=el('schedOverlay'); if(ov) ov.remove(); return; }
  if(S.scheduled.finalDue){
    S.scheduled.finalConfirmed=true;
    const ov=el('schedOverlay'); if(ov) ov.remove();
    startScheduledJob();
    return;
  }
  S.scheduled.confirmed=true;
  const ov=el('schedOverlay'); if(ov) ov.remove();
  render();
  toast(T('Readiness confirmed'),'check');
  // 5 minutes before the appointment → final confirmation alert (simulated)
  if(_final5TO) clearTimeout(_final5TO);
  _final5TO=setTimeout(()=>{ _final5TO=null;
    if(S.scheduled && !S.scheduled.finalConfirmed){
      S.scheduled.finalDue=true; S.scheduled.finalSeen=false;
      reRender();
      showSchedReminder(5);
    }
  }, 9000);
}
function dismissSchedReminder(){
  const ov=el('schedOverlay'); if(ov) ov.remove();
  reRender();
  toast(T('Reminder dismissed'),'close');
}
/* a confirmed scheduled booking goes live → becomes a normal active job with chat */
function startScheduledJob(){
  const r=S.scheduled; if(!r) return;
  if(_final5TO){ clearTimeout(_final5TO); _final5TO=null; }
  S.scheduled=null;
  S.job=Object.assign({}, r, {scheduled:false});
  S._acceptTs=Date.now();
  S.jobStage='enroute';
  if(typeof _resetTruckJourney==='function') _resetTruckJourney();
  S.docs={front:false,rear:false,left:false,right:false};
  S.codeInput=''; S.codeAttempts=0; S.chatUnread=0;
  S.deliveryCode=String(Math.floor(1000+Math.random()*9000));
  S.chatThread=[
    {who:'them',t:T2('Hi, I am near the gate 👋','مرحباً، أنا قرب البوابة 👋','ہائے، میں گیٹ کے قریب ہوں 👋'),at:'now'}
  ];
  go('job');
  toast(T2('Scheduled job started','بدأ الطلب المجدول','شیڈولڈ جاب شروع'),'check');
  scheduleVehicleInfoRequest();
}
function acceptReq(){
  clearReqTimer();
  const r=S._pendReq; if(!r) return;
  if(r.scheduled){
    S.scheduled=Object.assign({}, r, {confirmed:false});
    S.requests=S.requests.filter(x=>x.id!==r.id);
    _reqQueue=_reqQueue.filter(x=>x.id!==r.id);
    S._pendReq=null; S._reqExpanded=false;
    _ordTab='scheduled';
    go('history');
    toast(T('Scheduled job added'),'check');
    scheduleServe(1400);
    return;
  }
  S.job=Object.assign({}, r);
  S._acceptTs=Date.now();   // start of the 3-min free-cancel grace window
  S.requests=S.requests.filter(x=>x.id!==r.id);
  _reqQueue=_reqQueue.filter(x=>x.id!==r.id);
  S._pendReq=null;
  S.jobStage='enroute';
  if(typeof _resetTruckJourney==='function') _resetTruckJourney();
  S.docs={front:false,rear:false,left:false,right:false};
  S.codeInput=''; S.codeAttempts=0;
  S.deliveryCode=String(Math.floor(1000+Math.random()*9000));
  S.chatThread=[
    {who:'them',t:T2('Hi, I am near the gate 👋','مرحباً، أنا قرب البوابة 👋','ہائے، میں گیٹ کے قریب ہوں 👋'),at:'now'}
  ];
  go('job');
  scheduleVehicleInfoRequest();
}
/* 7s after accepting, the provider auto-sends a fill-in template asking the
   customer for the vehicle plate number, colour and type */
function scheduleVehicleInfoRequest(){
  const jobId = S.job && S.job.id;
  setTimeout(()=>{
    if(!S.job || S.job.id!==jobId) return;
    S.chatThread.push({who:'me',t:T2(
      'Send the details\n\nPlate number:\nVehicle color:\nVehicle type:',
      'أرسل البيانات\n\nرقم المركبة:\nلون المركبة:\nنوع المركبة:',
      'تفصیلات بھیجیں\n\nپلیٹ نمبر:\nگاڑی کا رنگ:\nگاڑی کی قسم:'),at:'now',nowrap:true});
    if(S.current==='job') reRender(); else { S.chatUnread=(S.chatUnread||0)+1; }
  }, 7000);
}

      </div>
      ${err?`<div style="color:var(--red);font-weight:700;font-size:13px;margin-bottom:12px">${T('Wrong code, try again')}${S.codeAttempts?` (${S.codeAttempts}/5)`:''}</div>`:''}

  if(st==='done' && S._simRatingShown){ html += driverRatingCardHTML(); }

function jobSend(){
  const i=el('jobMsgInput'); if(!i||!i.value.trim()) return;
  S.chatThread.push({who:'me',t:i.value.trim(),at:'now'}); reRender();
  setTimeout(()=>{ if(S.job){ customerSays(T2('👍 Thank you','👍 شكراً','👍 شکریہ')); } }, 900);

function capturePhoto(k,input){
  if(input && input.files && input.files[0]){
    const r=new FileReader();
    r.onload=e=>{ S.docImgs=S.docImgs||{}; S.docImgs[k]=e.target.result; S.docs[k]=true;
      const all=S.docs.front&&S.docs.rear&&S.docs.left&&S.docs.right;
      if(all && S.jobStage==='arrived') S.jobStage='docs';
      reRender(); };
    r.readAsDataURL(input.files[0]);
    return;
  }
  S.docs[k]=true;
  const all=S.docs.front&&S.docs.rear&&S.docs.left&&S.docs.right;
  if(all && S.jobStage==='arrived') S.jobStage='docs';
  reRender();
}
function jobAdvance(stage){

  S.jobStage=stage;
  const wash=jobIsWash();
  if(stage==='arrived'){ S.chatThread.push({who:'me',t:wash?T2("I've arrived at your location","وصلت إلى موقعك","میں آپ کی جگہ پہنچ گیا"):T2("I've arrived at the pickup point","وصلت إلى موقع التحميل","میں پک اپ پر پہنچ گیا"),at:'now'});

  if(stage==='transit'){ S.chatThread.push({who:'me',t:T2('Vehicle loaded & secured. Departing now.','تم التحميل والتأمين. أنطلق الآن.','گاڑی لوڈ اور محفوظ۔ روانہ ہو رہا ہوں۔'),at:'now'});

/* delivery code */
function codePush(n){
  if(S.codeInput.length>=4) return;
  S._codeErr=false; S.codeInput+=n; reRender();
  if(S.codeInput.length===4) setTimeout(verifyCode, 280);
}
function codeBack(){ S._codeErr=false; S.codeInput=S.codeInput.slice(0,-1); reRender(); }
function verifyCode(){
  if(S.codeInput===S.deliveryCode){
    [...document.querySelectorAll('.codebox')].forEach(b=>{b.classList.remove('active');b.classList.add('ok');});
    if(jobIsWash()){
      S.chatThread.push({who:'me',t:T2('✓ Code verified. Wash completed!','✓ تم التحقق. اكتمل الغسيل!','✓ کوڈ تصدیق۔ واش مکمل!'),at:'now'});
      S.chatThread.push({who:'me',photo:true,caption:T2('After-wash photo','صورة بعد الغسيل','واش کے بعد تصویر'),at:'now'});
      setTimeout(()=>{ if(S.job){ customerSays(T2('Looks great, thank you! 🚗✨','ممتاز، شكراً جزيلاً! 🚗✨','بہت اچھی، شکریہ! 🚗✨')); } }, 900);
      setTimeout(completeJob, 1500);
    } else {
      S.chatThread.push({who:'me',t:T2('✓ Code verified. Delivery confirmed!','✓ تم التحقق. تأكيد التسليم!','✓ کوڈ تصدیق۔ ڈیلیوری مکمل!'),at:'now'});
      setTimeout(completeJob, 700);
    }
  } else { S.codeAttempts++; S._codeErr=true; S.codeInput=''; reRender(); }
}
function completeJob(){
  S.jobStage='done';
  if(typeof bankJobEarnings==='function') bankJobEarnings();
  S._simRating=5; S._simRatingShown=true;
  reRender();
}
/* ---------------- CANCEL JOB (only before loading the vehicle) ----------------
   Allowed while still driving to the customer (enroute). Once the customer has
   requested the photos & the vehicle is being loaded, cancelling is blocked —
   the driver can only report a problem (openEmergency).
   GRACE WINDOW: free for the first 3 minutes after accepting; after that the
   cancellation still works but counts against the driver's acceptance rate. */
const CANCEL_GRACE_MS = 3*60*1000;
function canCancelJob(){ return !!S.job && S.jobStage==='enroute'; }
function cancelGraceLeft(){ return Math.max(0, CANCEL_GRACE_MS - (Date.now()-(S._acceptTs||0))); }
function cancelIsFree(){ return cancelGraceLeft()>0; }

function cancelSelect(id){

}
function submitCancelJob(){
  if(!_cancelSel) return;
  const rl=(DRIVER_CANCEL.find(r=>r[0]===_cancelSel)||[])[1]||'Other reason';

/* ---------- full scripted trip simulation (drives the job chat screen) ---------- */
function runJobSimulation(){
  if(!S.job || S._simRunning) return;
  S._simRunning=true; S._simRatingShown=false;
  const code=S.deliveryCode;
  const seq=[
    ()=>{ S.jobStage='arrived'; S.chatThread.push({who:'me',t:T2("I've arrived at the pickup","وصلت لموقع التحميل","میں پک اپ پر پہنچ گیا"),at:'now'}); },
    ()=>{ S.chatThread.push({who:'them',t:T2('Great, the white car 🚗','ممتاز، السيارة البيضاء 🚗','زبردست، سفید گاڑی 🚗'),at:'now'}); },
    ()=>{ S.jobStage='docs'; S.docs={front:true,rear:true,left:true,right:true}; S.chatThread.push({who:'me',t:T2('Photographing the vehicle 📸','أصوّر المركبة 📸','گاڑی کی تصاویر 📸'),at:'now'}); },
    ()=>{ S.jobStage='transit'; S.chatThread.push({who:'me',t:T2('Loaded & secured. Departing now.','تم التحميل والتأمين. أنطلق الآن.','لوڈ اور محفوظ۔ روانہ۔'),at:'now'}); },
    ()=>{ S.chatThread.push({who:'them',t:T2('Perfect, thank you!','رائع، شكراً!','بہترین، شکریہ!'),at:'now'}); },
    ()=>{ S.jobStage='code'; S.chatThread.push({who:'me',t:T2('Arrived at drop-off. Your code please?','وصلت للتنزيل. رمزك من فضلك؟','ڈراپ آف۔ آپ کا کوڈ؟'),at:'now'}); },
    ()=>{ S.chatThread.push({who:'them',t:T2('My code is ','رمزي هو ','میرا کوڈ ہے ')+code,at:'now'}); S.codeInput=code; },
    ()=>{ S.chatThread.push({who:'me',t:T2('✓ Code verified. Delivery confirmed!','✓ تم التحقق. تأكيد التسليم!','✓ کوڈ تصدیق۔ ڈیلیوری مکمل!'),at:'now'}); },
    ()=>{ S.jobStage='done'; if(typeof bankJobEarnings==='function') bankJobEarnings(); S._simRating=5; S._simRatingShown=true; },
  ];
  let i=0;
  (function step(){
    if(S.current!=='job' || !S.job){ S._simRunning=false; return; }
    seq[i](); i++;
    reRender();
    if(i>=seq.length){ S._simRunning=false; return; }
    setTimeout(step, 1250);
  })();
}
function bankJobEarnings(){
  if(S._earned) return; S._earned=true;
  const fare=S.job.fare;
  S.earnings.today+=fare; S.earnings.week+=fare; S.earnings.month+=fare; S.earnings.wallet+=fare; S.earnings.trips++;
  S.trips.unshift({ id:(S.job&&S.job.id)||('ORD-AUH-'+Math.floor(50320+Math.random()*40)), cust:S.job.cust, svc:S.job.svc, fare, date:'Today · now', rating:5, dist:S.job.dist });
}
function backToWork(){
  // archive this conversation into Chats (kept 24h) before clearing
  if(S.job){ S.savedChats.unshift({ cust:S.job.cust, svc:S.job.svc, ts:Date.now(), thread:[{type:'event',t:'Delivery confirmed'}].concat(S.chatThread.slice(-4)) }); }
  S.job=null; S.jobStage='enroute'; S._acceptTs=0; S.docs={front:false,rear:false,left:false,right:false};
  S.codeInput=''; S.codeAttempts=0; S.chatThread=[]; S._simRunning=false; S._simRatingShown=false; S._earned=false;
  S.online=true;
  if(typeof _resetTruckJourney==='function') _resetTruckJourney();
  closeModal(); go('home',{replace:true});
  toast(T2('Back online — ready for jobs','عدت للاتصال — جاهز للطلبات','واپس آن لائن — جابز کے لیے تیار'),'power');
}

function T2(en,ar,ur){ return S.lang==='ar'?ar:S.lang==='ur'?ur:en; }
/* escape user-controlled text before it is placed into innerHTML (XSS guard) */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function chatBubble(m){
  if(m.who==='system'){
    return `<div style="align-self:center;max-width:88%;display:flex;align-items:flex-start;gap:8px;background:var(--y-soft);border:1px solid var(--y);border-radius:12px;padding:9px 13px;margin:2px 0">
      ${ic('bell',16,'#FFCC00')}<span style="font-size:12px;font-weight:700;color:var(--fg);line-height:1.4">${escapeHtml(m.t)}</span></div>`;
  }
  if(m.photo){
    return `<div style="display:flex;flex-direction:column;max-width:78%;align-self:${m.who==='me'?'flex-end':'flex-start'}">
      <div style="border-radius:16px;overflow:hidden;border:1.5px solid var(--hair);background:var(--g2);width:200px">
        <div style="height:130px;background:repeating-linear-gradient(135deg,var(--g3) 0 10px,var(--g2) 10px 20px);display:flex;align-items:center;justify-content:center">${ic('camera',30,'var(--sub)')}</div>
        <div style="display:flex;align-items:center;gap:6px;padding:8px 11px;font-size:12px;font-weight:700">${ic('check',14,'#22C55E',3)} ${escapeHtml(m.caption||'')}</div>
      </div>${m.at?`<div class="chat-time" style="text-align:${m.who==='me'?'end':'start'}">${escapeHtml(m.at)}</div>`:''}</div>`;
  }
  return `<div style="display:flex;flex-direction:column;max-width:${m.nowrap?'100%':'78%'};align-self:${m.who==='me'?'flex-end':'flex-start'}">
    <div class="bubble ${m.who}"${m.nowrap?' style="white-space:nowrap;max-width:none"':''}>${escapeHtml(m.t).replace(/\n/g,'<br>')}</div>${m.at?`<div class="chat-time" style="text-align:${m.who==='me'?'end':'start'}">${escapeHtml(m.at)}</div>`:''}</div>`;
}
function paintDChat(){
  const box=el('dChatBox'); if(!box) return;
  const events = S.job ? jobStatusEvents() : [];
  box.innerHTML =
    events.map(statusEventHTML).join('') +
    (events.length?`<div style="text-align:center;font-size:11px;color:var(--faint);margin:4px 0">— ${T2('Messages','الرسائل','پیغامات')} —</div>`:'') +
    S.chatThread.map(chatBubble).join('') +
    (S._simRatingShown?driverRatingCardHTML():'');
  box.scrollTop=box.scrollHeight;
}
function driverRatingCardHTML(){
  const r=S._simRating||5;
  return `<div style="align-self:stretch;background:var(--g1);border:1.5px solid var(--green);border-radius:16px;padding:16px;margin:6px 0;text-align:center">

  </div>`;
}
function dChatQuick(t){ S.chatThread.push({who:'me',t,at:'now'}); paintDChat();

function confirmWithdraw(){
  const bal=S.earnings.wallet;
  const v=parseInt((el('wdAmt')||{}).value)||0;
  const hint=el('wdHint');
  if(v<=0){ if(hint){hint.textContent=T('Enter a valid amount');hint.style.color='#EF4444';} return; }
  if(v>bal){ if(hint){hint.textContent=T('Amount exceeds your balance');hint.style.color='#EF4444';} return; }
  // hold the funds out of the wallet and mark the request pending until admin confirms
  S.earnings.wallet=bal - v;
  S.earnings.pendingWithdraw={amount:v, ts:Date.now()};
  closeModal(); reRender();
  toast(T('Withdrawal requested')+' · '+aed(v)+' · '+T('Funds arrive within 24 hours'),'bank');
}
// simulates the admin approving the payout and notifying the driver
function simAdminWithdrawApprove(){
  const p=S.earnings.pendingWithdraw; if(!p) return;
  S.earnings.pendingWithdraw=null;
  reRender();
  toast(T('Withdrawal approved')+' · '+aed(p.amount)+' '+T('transferred to your bank'),'check');
}

function copyRefLink(link, which){
  let ok=false;
  // primary: synchronous textarea + execCommand (works inside sandboxed iframe)
  try{
    const ta=document.createElement('textarea');
    ta.value=link; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, link.length);
    ok=document.execCommand('copy'); document.body.removeChild(ta);
  }catch(e){}
  // also try async clipboard (real devices), swallow any rejection
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(link).then(()=>{}).catch(()=>{}); ok=true; } }catch(e){}
  // native share if available (Share link button), swallow rejection
  if(which==='share' && navigator.share){ try{ navigator.share({title:'MOVAROW', text:T('Invite a driver'), url:link}).then(()=>{}).catch(()=>{}); }catch(e){} }
  // visual feedback on the pressed button
  const btn = el(which==='share' ? 'refShareBtn' : 'refCopyBtn');
  if(btn){
    const lbl=btn.querySelector('span');
    if(which==='copy'){ btn.style.background='var(--y)'; btn.style.color='#0B0B0B'; }
    else { btn.style.background='var(--green)'; btn.style.color='#fff'; }
    if(lbl) lbl.textContent=T('Copied');
    setTimeout(()=>{ 
      if(which==='copy'){ btn.style.background='var(--g2)'; btn.style.color='var(--ink)'; if(lbl) lbl.textContent=T('Copy'); }
      else { btn.style.background=''; btn.style.color=''; if(lbl) lbl.textContent=T('Share link'); }
    }, 1600);
  }
  if(ok) toast(T('Link copied'),'check');
}

                ${ic('shield',12,'#FFCC00')}<span style="font-weight:800;font-size:12px;letter-spacing:.5px;font-family:ui-monospace,Menlo,monospace;color:var(--ink)">${fullDriverId()}</span>${ic('copy',12,'var(--sub)')}

                ${ic('star',13,'#FFCC00').replace('fill="none"','fill="#FFCC00"')}
                <span style="font-weight:800;font-size:13px;color:var(--y)">${d.rating}</span>

        </div>

          ${ic('clock',17,'#FFCC00')}<span style="flex:1;font-size:12.5px;font-weight:700;color:var(--ink)">${T2('Profile change pending admin review','تعديل الملف قيد مراجعة الإدارة','پروفائل تبدیلی زیرِ جائزہ')}</span></div>`:''}
        <div class="seg" style="margin-bottom:8px;height:40px">

          <button class="${S.theme==='light'?'on':''}" onclick="setTheme('light')" style="display:flex;align-items:center;justify-content:center;gap:7px">${ic('sun',16,S.theme==='light'?'#0B0B0B':'#FFCC00')} ${T2('Light','فاتح','لائٹ')}</button>
        </div>
        <div class="card" style="overflow:hidden;margin-bottom:8px">
          ${items.map(([icn,lbl,fn])=>`<button class="menurow" style="padding:9px 16px" onclick="${fn()}"><span class="mi" style="width:30px;height:30px">${ic(icn,18,'#FFCC00')}</span><span class="ml">${T(lbl)}</span>${ic('chevron',18,'#6B6B70')}</button>`).join('')}
        </div>

    <label class="field-lbl">${T2('Phone number','رقم الهاتف','فون نمبر')}</label>
    <div class="field" style="margin-bottom:14px;display:flex;align-items:center;gap:8px;opacity:.7">
      <span style="flex:1;color:var(--sub)">${d.phone}</span>
      ${ic('shield',16,'#FFCC00')}<span style="font-size:11px;font-weight:700;color:var(--y)">${T2('Verified','موثّق','تصدیق شدہ')}</span>
    </div>
    <div style="display:flex;align-items:flex-start;gap:9px;background:var(--y-soft);border:1px solid rgba(255,204,0,.25);border-radius:13px;padding:11px 13px;margin-bottom:16px">
      ${ic('shield',17,'#FFCC00')}
      <span style="flex:1;font-size:12px;line-height:1.45;color:var(--sub);text-wrap:pretty">${T2('Changes to your personal details require admin review before they take effect.','تعديل بياناتك الشخصية يتطلب مراجعة الإدارة قبل اعتماده.','ذاتی تفصیلات کی تبدیلی نافذ ہونے سے پہلے ایڈمن کے جائزے کی ضرورت ہے۔')}</span>
    </div>
    ${S.profileReqPending?`<div class="btn" style="background:var(--g2);color:var(--sub);font-weight:700;pointer-events:none">${ic('clock',17,'var(--sub)')} ${T2('Change request under review','طلب التعديل قيد المراجعة','تبدیلی کی درخواست زیرِ جائزہ')}</div>`:`<button class="btn btn-primary" onclick="submitProfileRequest()">${ic('nav',17,'#0B0B0B')} ${T2('Submit for review','إرسال للمراجعة','جائزے کے لیے بھیجیں')}</button>`}`);
}
function submitProfileRequest(){
  const n=el('epName');
  const name=n?escapeHtml(n.value.trim()):'';
  if(!name){ closeModal(); return; }
  S.profileReqPending={ name, ts:Date.now() };
  closeModal(); reRender();
  toast(T2('Request sent to admin for review','تم إرسال الطلب للإدارة للمراجعة','درخواست ایڈمن کو بھیج دی گئی'),'check');
}
